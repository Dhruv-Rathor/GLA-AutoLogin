name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Updated to v5)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project, Fix Encoding, and Build
        run: |
          # 1. If the 'GLAAutoLogin' folder itself was uploaded, move inside it
          if [ -d "GLAAutoLogin" ] && [ -f "GLAAutoLogin/build.gradle" ]; then
            cd GLAAutoLogin
          fi
          
          # 2. Fix potential UTF-16 encoding issues caused by Windows PowerShell
          find . -type f -name "*.java" -o -name "*.gradle" -o -name "*.xml" | while read -r file; do
            if file "$file" | grep -q "UTF-16"; then
              iconv -f UTF-16 -t UTF-8 "$file" -o "$file.tmp" && mv "$file.tmp" "$file"
            fi
          done

          # 3. Generate a dedicated Gradle Wrapper
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.3
          
          # 4. Build the APK with detailed error logging enabled
          echo "Building APK..."
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
