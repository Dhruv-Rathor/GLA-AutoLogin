```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.3'

      - name: Fix Windows Encoding
        shell: bash
        run: |
          set -e

          find . -type f \( \
            -name "*.java" \
            -o -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "*.xml" \
          \) -print0 |
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "UTF-16"; then
              echo "Converting UTF-16: $file"
              iconv -f UTF-16 -t UTF-8 "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.3
          chmod +x ./gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
