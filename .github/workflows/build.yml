name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Windows Encoding & Build APK
        run: |
          # 1. Move into the project folder if it exists
          if [ -d "GLAAutoLogin" ]; then cd GLAAutoLogin; fi
          
          # 2. Convert PowerShell UTF-16 files to standard UTF-8
          find . -type f \( -name "*.java" -o -name "*.gradle" -o -name "*.xml" \) | while read file; do
            if file "$file" | grep -q "UTF-16"; then
              iconv -f UTF-16 -t UTF-8 "$file" -o "$file.tmp" && mv "$file.tmp" "$file"
            fi
          done
          
          # 3. Generate the build wrapper and compile the APK
          gradle wrapper --gradle-version 8.3
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
