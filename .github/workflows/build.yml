name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.3
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.3'

      - name: Check project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Working directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Fix source encoding
        shell: bash
        run: |
          set -e

          find . -type f \( \
            -name "*.java" \
            -o -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "*.xml" \
          \) -print0 |
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "UTF-16"; then
              echo "Converting UTF-16: $file"
              iconv -f UTF-16 -t UTF-8 "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          gradle wrapper --gradle-version 8.3
          chmod +x gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

